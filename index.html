<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f1;--ink:#1c1c1c;--muted:#7a7a7a;--faint:#a6a6a6;--line:#d7d5d1;--panel:#fbfaf8;--draw:#232323;--hot:#1c1c1c;--ring:#f4f3f1}
html{overflow-y:scroll}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.6 "IBM Plex Mono",ui-monospace,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:15px;font-weight:500;margin:0;letter-spacing:.04em;text-transform:uppercase}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);padding:5px 12px;cursor:pointer;border-radius:0}
button:hover{border-color:var(--ink)}button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin:18px 0;overflow-x:auto}
nav.tabs button{border:0;border-bottom:2px solid transparent;padding:8px 16px;color:var(--muted)}
nav.tabs button.on{background:none;color:var(--ink);border-bottom-color:var(--ink)}
.seg{display:inline-flex;margin-bottom:14px}.seg button+button{border-left:0}
.page{display:none}.page.on{display:block}
.main{align-items:start;display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);background:var(--panel)}
.viewer{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;background:var(--bg)}
.viewer svg{display:block;width:100%;height:auto}
#bg.int{opacity:.92}
.hs{cursor:pointer}.hs .hit{fill:transparent}
.hs .dot{fill:var(--hot);stroke:var(--ring);stroke-width:2.5}
.hs .halo{fill:none;stroke:var(--hot);stroke-width:1.2;opacity:0}
.hs:hover .halo{opacity:.5}
.hs.on .dot{r:10}.hs.on .halo{opacity:1}
.hs text{font:500 21px "IBM Plex Mono",monospace;fill:var(--ink);paint-order:stroke;stroke:var(--ring);stroke-width:6px;opacity:0;pointer-events:none}
.hs.on text{opacity:1}
.hs.on line{opacity:1}.hs line{stroke:var(--hot);stroke-width:1;opacity:0}
.panel{padding:16px}.panel h2{font-size:12px;font-weight:500;margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
#tagwrap{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:3px 8px}.tag.on{background:var(--ink);color:var(--bg)}
#desc{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
#desc b{display:block;font-weight:500;font-size:14px;margin-bottom:4px}#desc span{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cell{border:1px solid var(--line);background:var(--panel);padding:12px}
.cell svg{width:100%;height:96px;display:block;stroke:var(--draw);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.cell b{display:block;font-weight:500;margin-top:8px}.cell span{color:var(--muted);font-size:12px}
.cell.b{background:var(--bg);padding:0 0 12px}.cell.b img{width:100%;aspect-ratio:1.15;object-fit:contain;display:block;border-bottom:1px solid var(--line)}.cell.b b,.cell.b span{display:block;padding:0 12px}.lead{color:var(--muted);margin:0 0 14px;height:33px;display:flex;align-items:center}
#g-bicos{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.viewer.small svg{width:75%;margin:0 auto}#g-bicos{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))!important}#g-asas{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}#g-asas img{aspect-ratio:auto!important}#g-asas{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.wsvg{width:100%;height:auto!important;display:block;stroke:none!important;border-bottom:1px solid var(--line)}.wsvg text{font-family:"IBM Plex Mono",monospace;fill:#1c1c1c;stroke:none}#g-patas{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}#g-patas img{aspect-ratio:1!important;padding:6px}</style></head><body><div class="wrap">

const g=document.getElementById('hs'),tw=document.getElementById('tagwrap'),dsc=document.getElementById('desc');
const NS='http://www.w3.org/2000/svg';let mode='ext',cur=null;
function render(){g.innerHTML='';tw.innerHTML='';dsc.innerHTML='<span>Clique em um ponto ou etiqueta.</span>';cur=null;
 document.getElementById('ptitle').textContent=mode=='ext'?'Morfologia externa':'Morfologia interna';
 const D=mode=='int'?INT:EXT,bg=document.getElementById('bg');bg.setAttribute('href',mode=='int'?IMGI:IMGE);bg.setAttribute('class',mode);document.querySelector('.viewer').classList.toggle('small',mode=='int');document.getElementById('svg').setAttribute('viewBox',mode=='int'?'30 170 1500 790':'40 150 1600 740');
 for(const k in D){const [n,f,x,y,d]=D[k];
  const e=document.createElementNS(NS,'g');e.setAttribute('class','hs');e.dataset.k=k;
  const dx=d=='l'?-1:d=='r'?1:0,dy=d=='u'?-1:d=='d'?1:0;
  const tx=x+dx*58+(dx>0?4:dx<0?-4:0),ty=y+dy*50+(dy==0?4:dy>0?10:-4);
  e.innerHTML=`<line x1="${x}" y1="${y}" x2="${x+dx*50}" y2="${y+dy*42}"/><circle class="halo" cx="${x}" cy="${y}" r="18"/><circle class="hit" cx="${x}" cy="${y}" r="22"/><circle class="dot" cx="${x}" cy="${y}" r="6.5"/><text x="${tx}" y="${ty}" text-anchor="${dx<0?'end':dx>0?'start':'middle'}">${n.split(' (')[0]}</text>`;
  e.onclick=()=>sel(k);g.appendChild(e);
  const b=document.createElement('button');b.className='tag';b.textContent=n.split(' (')[0];b.dataset.k=k;b.onclick=()=>sel(k);tw.appendChild(b)}}
function sel(k){cur=k;document.querySelectorAll('.hs,.tag').forEach(e=>e.classList.toggle('on',e.dataset.k==k));
 const[n,f]=(mode=='int'?INT:EXT)[k];dsc.innerHTML=`<b>${n}</b><span>${f}</span>`;
 const el=g.querySelector(`[data-k=${k}]`);g.appendChild(el)}
document.getElementById('seg').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b.dataset.m==m));render()};
document.getElementById('tabs').onclick=e=>{const p=e.target.dataset.p;if(!p)return;[...e.currentTarget.children].forEach(b=>b.classList.toggle('on',b.dataset.p==p));document.querySelectorAll('.page').forEach(s=>s.classList.toggle('on',s.id=='page-'+p))};
render();
